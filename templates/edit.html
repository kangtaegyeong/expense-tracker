<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>지출 수정</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>지출 수정</h1>

    <div class="card">

        <form action="/update-expense" method="POST">

            <input
                type="hidden"
                name="index"
                value="{{ index }}"
            >

            <label>카테고리</label>

            <select name="category" required>
                <option value="식비" {% if expense[2] == "식비" %}selected{% endif %}>식비</option>
                <option value="교통" {% if expense[2] == "교통" %}selected{% endif %}>교통</option>
                <option value="쇼핑" {% if expense[2] == "쇼핑" %}selected{% endif %}>쇼핑</option>
                <option value="생활" {% if expense[2] == "생활" %}selected{% endif %}>생활</option>
                <option value="기타" {% if expense[2] == "기타" %}selected{% endif %}>기타</option>
            </select>


            <label>지출 내역</label>

            <input
                type="text"
                name="name"
                value="{{ expense[0] }}"
                required
            >


            <label>지출 금액</label>

            <input
                type="number"
                name="price"
                value="{{ expense[1] }}"
                required
            >


            <button type="submit">
                수정 완료
            </button>

        </form>

    </div>


    <a href="/tracker" class="back-link">
        취소
    </a>

</div>

</body>
</html>
