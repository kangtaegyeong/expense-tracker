<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="container">

    <div class="tracker-header">

        <a href="/" class="back-button">
            ‹
        </a>

        <h1>Expense Tracker</h1>

    </div>


    <p class="current-file">
        현재 목록: {{ current_filename }}
    </p>


    <div class="card">

        <h2>지출 추가</h2>

        <form action="/add-expense" method="POST">
            <label>카테고리</label>
            <select name="category" required>
                <option value="식비">식비</option>
                <option value="교통">교통</option>
                <option value="쇼핑">쇼핑</option>
                <option value="생활">생활</option>
                <option value="기타">기타</option>
            </select>

            <label>지출 내역</label>

            <input
                type="text"
                name="name"
                placeholder="예: 점심"
                required
            >


            <label>지출 금액</label>

            <input
                type="number"
                name="price"
                placeholder="예: 12000"
                required
            >


            <button type="submit">
                지출 추가
            </button>

        </form>

    </div>


    <div class="card">

        <h2>지출 목록</h2>

        <ul class="expense-list">

            {% for expense in expenses %}

            <li class="expense-item">

                <div class="expense-info">
                    <span>{{ expense[0] }}</span>
                    <span>{{ expense[2] }}</span>
                    <strong>{{ "{:,}".format(expense[1]) }}원</strong>
                </div>


                <div class="expense-actions">

                    <form
                        action="/edit-expense"
                        method="GET"
                    >

                        <input
                            type="hidden"
                            name="index"
                            value="{{ loop.index0 }}"
                        >

                        <button
                            type="submit"
                            class="edit-button"
                        >
                            수정
                        </button>

                    </form>


                    <form
                        action="/delete-expense"
                        method="POST"
                    >

                        <input
                            type="hidden"
                            name="index"
                            value="{{ loop.index0 }}"
                        >

                        <button
                            type="submit"
                            class="delete-button"
                        >
                            삭제
                        </button>

                    </form>

                </div>

            </li>

            {% endfor %}

        </ul>

    </div>


    <div class="card total-box">

        <span>총 지출</span>

        <strong>
            {{ "{:,}".format(total) }}원
        </strong>

    </div>


    <form action="/save" method="POST">

        <button
            type="submit"
            class="save-button"
        >
            저장
        </button>

    </form>

</div>

</body>




</html>
